[profile.default]
src = "assets/erc-8506/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./assets" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
